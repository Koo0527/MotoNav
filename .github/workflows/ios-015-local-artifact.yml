name: Build iOS 0.15.0 artifact
on:
  push:
    branches:
      - codex/build-ios-0-15-0-20261027
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 安装 CocoaPods
        run: sudo gem install cocoapods -v 1.16.2 --no-document
      - name: 编译 iOS 并生成未签名 IPA
        run: bash scripts/build-ios-local.sh
      - name: 保存 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoNav-iOS-0.15.0-unsigned
          path: |
            output/MotoNav-0.15.0-unsigned.ipa
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: 保存失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MotoNav-iOS-0.15.0-build-log
          path: output/*.log
          if-no-files-found: ignore
          retention-days: 14
