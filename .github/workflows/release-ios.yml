name: iOS Build and Verify
on:
  push:
    branches: [main]
    paths: ['RELEASE_VERSION', 'docs/RELEASE-IOS-*.md', 'ios/**', 'scripts/build-ios*.sh', 'build-ios.sh', 'firmware/boards/175/MotoNav/**', '.github/workflows/release-ios.yml']
  pull_request:
    paths: ['RELEASE_VERSION', 'docs/RELEASE-IOS-*.md', 'ios/**', 'scripts/build-ios*.sh', 'build-ios.sh', 'firmware/boards/175/MotoNav/**', '.github/workflows/release-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: motonav-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify local iOS fixes, unified planner and tunnel controls
        run: |
          python3 ios/tests/ios-fixes/check.py
          python3 ios/tests/unified-planner/check.py
          python3 ios/tests/tunnel-settings/check.py
          python3 ios/tests/g-recording/check.py
          swiftc ios/MotoNav/GMotionReporter.swift ios/tests/g-motion/main.swift -o /tmp/g-motion
          /tmp/g-motion
          python3 ios/tests/g-motion/check-location.py
          swiftc ios/MotoNav/BleCapabilityProbe.swift ios/MotoNav/BleHandshakeClock.swift ios/tests/ble-capability/main.swift -o /tmp/ble-capability
          /tmp/ble-capability
          swiftc ios/MotoNav/GChartGeometry.swift ios/tests/g-chart/main.swift -o /tmp/g-chart
          /tmp/g-chart
          python3 ios/tests/tunnel-sdk/check.py
          swiftc ios/MotoNav/TunnelDimming.swift ios/tests/tunnel-dimming/main.swift -o /tmp/tunnel-dimming
          /tmp/tunnel-dimming
          swiftc ios/MotoNav/PhoneClockSync.swift ios/tests/phone-clock/main.swift -o /tmp/phone-clock
          /tmp/phone-clock
          swiftc ios/MotoNav/NavigationSpeed.swift ios/tests/sim-speed/main.swift -o /tmp/sim-speed
          /tmp/sim-speed
      - name: Verify report export and record recovery
        run: |
          swiftc ios/MotoNav/MapReportExport.swift ios/tests/map-export/main.swift -o /tmp/map-export
          /tmp/map-export
      - name: Verify map transport and published receiver
        run: |
          set -euo pipefail
          cmp ios/tests/building-continuity/fixture/RasterBuildingCarry.h firmware/boards/175/MotoNav/RasterBuildingCarry.h
          cmp ios/tests/building-continuity/fixture/RasterContinuity.h firmware/boards/175/MotoNav/RasterContinuity.h
          cmp ios/tests/building-continuity/fixture/src/map/RasterDecoder.h firmware/boards/175/MotoNav/src/map/RasterDecoder.h
          swiftc -O ios/MotoNav/MapGeo.swift ios/MotoNav/RasterProcessing.swift ios/MotoNav/BleBulkWriteQueue.swift ios/MotoNav/BleWritePacer.swift ios/tests/map-wire/main.swift -o /tmp/map-wire
          /tmp/map-wire
          clang++ -std=c++17 ios/tests/map-wire/receiver.cpp -o /tmp/bulk-receiver
          /tmp/bulk-receiver
          clang++ -std=c++17 -O2 ios/tests/building-continuity/main.cpp -o /tmp/building-continuity
          /tmp/building-continuity
      - uses: actions/cache/restore@v4
        id: pods
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ios-pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
      - name: Reuse previously verified public SDK cache
        if: steps.pods.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/LockedSDK" "$HOME/Library/Caches"
          if gh run download 41173836576 -R zyn950929/MotoNav -n ios-locked-pods-cache -D "$RUNNER_TEMP/LockedSDK"; then
            tar -xzf "$RUNNER_TEMP/LockedSDK/ios-locked-pods-cache.tar.gz" -C "$HOME/Library/Caches"
          else
            echo 'Verified cache unavailable; CocoaPods will download the locked SDK versions.'
          fi
      - name: Install locked dependencies
        timeout-minutes: 10
        working-directory: ios
        run: |
          sudo gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install --deployment
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ios-pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
      - name: Verify reroute recovery and screen-off cached maps
        run: |
          python3 ios/tests/reroute-recovery/run.py
          python3 ios/tests/screenoff-maps/run.py
      - name: Verify progressive building capture and delivery
        run: |
          python3 ios/tests/building-capture/check.py
          python3 ios/tests/building-delivery/check.py
          python3 ios/tests/building-offline/check.py
          python3 ios/tests/map-smoothing/check.py
          python3 ios/tests/smoothing-cache/check.py
          swiftc -O ios/MotoNav/MapGeo.swift ios/MotoNav/RasterProcessing.swift ios/MotoNav/RouteMapPlan.swift ios/tests/building-progress/main.swift -o /tmp/building-progress
          /tmp/building-progress
      - name: Verify navigation, BLE clock and route history
        run: |
          set -euo pipefail
          python3 ios/tests/webmotor/check.py | tee parity-tests.log
          swiftc -O ios/MotoNav/MapGeo.swift ios/MotoNav/RasterProcessing.swift ios/MotoNav/RouteMapPlan.swift ios/tests/maps/main.swift -o /tmp/maps
          /tmp/maps
          swiftc ios/MotoNav/BleWritePacer.swift ios/tests/ble-pacing/main.swift -o /tmp/pacing
          /tmp/pacing
          swiftc ios/MotoNav/BleIdlePolicy.swift ios/tests/ble-idle-policy/main.swift -o /tmp/ble-idle
          /tmp/ble-idle
          swiftc ios/MotoNav/ArrivalPolicy.swift ios/tests/arrival/main.swift -o /tmp/arrival
          /tmp/arrival
          clang++ -std=c++17 ios/tests/phone-clock/receiver.cpp -o /tmp/clock-receiver
          /tmp/clock-receiver
          swiftc ios/MotoNav/AMSMetadata.swift ios/tests/music/main.swift -o /tmp/music
          /tmp/music
          swiftc ios/MotoNav/ArrivalPolicy.swift ios/MotoNav/NaviSessionCallbacks.swift ios/tests/arrival-relay/SDKStubs.swift ios/tests/arrival-relay/main.swift -o /tmp/relay
          /tmp/relay
          python3 ios/tests/lane-guidance/check.py
          swiftc -O ios/MotoNav/MapGeo.swift ios/MotoNav/RasterProcessing.swift ios/MotoNav/MapStyles.swift ios/tests/four-styles/main.swift -o /tmp/styles
          /tmp/styles
          swiftc -O ios/MotoNav/MapGeo.swift ios/MotoNav/RasterProcessing.swift ios/MotoNav/MapStyles.swift ios/MotoNav/RouteMapPlan.swift ios/tests/map-delivery/main.swift -o /tmp/map-delivery
          /tmp/map-delivery
          swiftc ios/MotoNav/BleBulkWriteQueue.swift ios/MotoNav/BleWritePacer.swift ios/tests/ble-bulk/main.swift -o /tmp/bulk
          /tmp/bulk
      - name: Build iPhone Release arm64 and unsigned IPA
        env:
          MOTONAV_DERIVED_DATA: ${{ runner.temp }}/Derived
        run: |
          set -o pipefail
          bash scripts/build-ios-ipa.sh | tee build-ios.log
      - name: Verify icon and identify artifact
        id: package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Derived/Build/Products/Release-iphoneos/MotoNav.app"
          python3 - "$APP" <<'PY'
          import pathlib,plistlib,struct,sys,json,hashlib,shutil
          app=pathlib.Path(sys.argv[1])
          src=pathlib.Path('ios/MotoNav/Assets.xcassets/AppIcon.appiconset/icon.png')
          raw=src.read_bytes()
          assert struct.unpack('>II',raw[16:24])==(1024,1024) and raw[25]==2
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert info['CFBundleIcons']['CFBundlePrimaryIcon']['CFBundleIconName']=='AppIcon'
          icons=list(app.glob('AppIcon*.png'))
          assert icons
          record={'sourceSHA256':hashlib.sha256(raw).hexdigest(),'sourceSize':[1024,1024],'opaqueRGB':True,'compiledIconFiles':[p.name for p in icons],'bundleVersion':info['CFBundleVersion']}
          pathlib.Path('output/ios/icon-verification.json').write_text(json.dumps(record,indent=2))
          shutil.copy2(src,'output/ios/icon-preview.png')
          print('PASS 1024x1024 opaque icon and compiled AppIcon bundle entries')
          PY
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" >> "$GITHUB_OUTPUT"
          echo "build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" >> "$GITHUB_OUTPUT"

      - name: Identify an explicitly versioned iOS release
        id: release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          IOS_EVENT: ${{ github.event_name }}
          IOS_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$IOS_EVENT" == workflow_dispatch ]] || git diff --name-only "$IOS_BEFORE" "$GITHUB_SHA" -- RELEASE_VERSION | grep -qx RELEASE_VERSION; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Package iOS release sources and instructions
        if: steps.release.outputs.publish == 'true'
        env:
          BUILT_VERSION: ${{ steps.package.outputs.version }}
        run: |
          VERSION=$(tr -d '[:space:]' < RELEASE_VERSION)
          test "$VERSION" = "$BUILT_VERSION"
          git archive --format=zip --prefix=MotoNav/ HEAD > "output/ios/MotoNav-${VERSION}-source.zip"
          cp docs/INSTALL-IOS.md output/ios/INSTALL-IOS.md
          cp "docs/RELEASE-IOS-${VERSION}.md" output/ios/RELEASE-NOTES.md
          (cd output/ios && shasum -a 256 *.ipa *.zip *.md > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MotoNav-iOS-${{ steps.package.outputs.version || 'build' }}-Build${{ steps.package.outputs.build || github.run_number }}
          path: |
            output/ios/
            build-ios.log
            parity-tests.log
          if-no-files-found: warn

      - name: Publish the independent iOS release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < RELEASE_VERSION)
          TAG="ios-v${VERSION}"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "MotoNav iOS ${VERSION}" --notes-file "docs/RELEASE-IOS-${VERSION}.md" --draft
          gh release upload "$TAG" output/ios/*.ipa output/ios/*.zip output/ios/*.md output/ios/SHA256SUMS.txt
          gh release edit "$TAG" --draft=false
